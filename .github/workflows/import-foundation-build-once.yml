name: Import verified foundation output once
on:
  push:
    branches: [feat/ZT01-02-engineering-foundation]
    paths: [.github/workflows/import-foundation-build-once.yml]
permissions: {}
concurrency:
  group: foundation-output-import
  cancel-in-progress: false
jobs:
  import-data:
    if: github.repository == 'ntygod/Zentwine' && github.ref == 'refs/heads/feat/ZT01-02-engineering-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Import only the reviewed artifact data; do not checkout or execute repository code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, hashlib, io, zipfile, urllib.request, urllib.error, urllib.parse
          from pathlib import PurePosixPath
          repo = 'ntygod/Zentwine'
          branch = 'feat/ZT01-02-engineering-foundation'
          source = 'f60f4bd664abd01b7e282ebd4b556c49cdc11cf8'
          artifact_id = 10799636683
          expected_zip = 'e5b9c814166446d0ae8570321fcf8c5b5c94c70dcef9f97e528f8e86dbbb5dab'
          expected_format = 'c65b7b30c80ead419c012fa2417834bfd23f2b61267a7ad786ca6e7d70ad7509'
          expected_lock = '162cb3a48c9a84d506fc4e81261e52adc9e7dd4eee67e17abd7eaaf734e44691'
          current = os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          base = 'https://api.github.com/repos/' + repo
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'Zentwine-verified-data-import', 'Content-Type': 'application/json'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def api(path, method='GET', data=None):
              request = urllib.request.Request(base + path, data=None if data is None else json.dumps(data).encode(), headers=headers, method=method)
              with opener.open(request, timeout=30) as response:
                  return json.load(response)
          run = api('/actions/runs/35979485829')
          assert run['conclusion'] == 'success' and run['head_sha'] == source
          meta = api('/actions/artifacts/' + str(artifact_id))
          assert not meta['expired'] and meta['workflow_run']['head_sha'] == source
          assert meta['digest'] == 'sha256:' + expected_zip
          commit = api('/git/commits/' + current)
          assert [parent['sha'] for parent in commit['parents']] == [source]
          comparison = api('/compare/' + source + '...' + current)
          assert {item['filename'] for item in comparison['files']} == {'.github/workflows/import-foundation-build-once.yml'}
          assert api('/git/ref/heads/' + branch)['object']['sha'] == current
          request = urllib.request.Request(base + '/actions/artifacts/' + str(artifact_id) + '/zip', headers=headers)
          try:
              response = opener.open(request, timeout=30)
          except urllib.error.HTTPError as error:
              assert error.code in (301,302,303,307,308)
              location = error.headers['Location']
              assert urllib.parse.urlsplit(location).scheme == 'https'
              # Never forward the GitHub token to the signed blob URL.
              response = urllib.request.urlopen(location, timeout=60)
          with response:
              archive = response.read(30_000_001)
          assert len(archive) <= 30_000_000 and hashlib.sha256(archive).hexdigest() == expected_zip
          bundle = zipfile.ZipFile(io.BytesIO(archive))
          def member(name, limit):
              item = bundle.getinfo(name)
              assert item.file_size <= limit
              return bundle.read(item)
          formatted = member('formatted-files.json', 2_000_000)
          lock = member('pnpm-lock.yaml', 1_000_000)
          assert hashlib.sha256(formatted).hexdigest() == expected_format
          assert hashlib.sha256(lock).hexdigest() == expected_lock
          assert member('tested-commit.txt', 100).decode().strip() == 'afe8a67fa19b3d6f3c8728e61ad3886d5aa2a953'
          changes = json.loads(formatted)
          assert len(changes) == 47
          source_tree = api('/git/trees/' + source + '?recursive=1')
          assert not source_tree['truncated']
          source_files = {item['path']: item for item in source_tree['tree'] if item['type'] == 'blob'}
          roots = {'package.json','tsconfig.base.json','pnpm-workspace.yaml','playwright.config.ts'}
          def permitted(path):
              p = PurePosixPath(path)
              assert not p.is_absolute() and '..' not in p.parts and '\\' not in path
              return path in roots or path.startswith(('apps/','services/api/','packages/','tests/','scripts/')) and p.suffix in {'.ts','.tsx','.mjs','.json','.css','.html'}
          for path, text in changes.items():
              assert permitted(path) and path in source_files and source_files[path]['mode'] == '100644'
              assert isinstance(text, str) and len(text.encode()) <= 200_000
          assert 'pnpm-lock.yaml' not in source_files
          changes['pnpm-lock.yaml'] = lock.decode('utf-8')
          entries = [{'path': p, 'mode':'100644', 'type':'blob', 'content':c} for p,c in sorted(changes.items())]
          tree = api('/git/trees','POST',{'base_tree':commit['tree']['sha'],'tree':entries})
          result = api('/git/commits','POST',{'message':'build(ZT01-02): commit verified formatting and exact dependency lock','tree':tree['sha'],'parents':[current]})
          assert api('/git/ref/heads/' + branch)['object']['sha'] == current
          api('/git/refs/heads/' + branch,'PATCH',{'sha':result['sha'],'force':False})
          print('Imported 47 reviewed formatted files and one exact lock onto the feature branch:', result['sha'])
          PY
