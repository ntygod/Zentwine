# Temporary, data-only import of the already-tested lock. Removed after import.
name: Capture verified ZT01 lock once
on:
  pull_request:
    paths: ['.github/workflows/capture-zt01-lock.yml']
permissions: {}
jobs:
  capture:
    if: >-
      github.repository == 'ntygod/Zentwine' &&
      github.event.pull_request.head.repo.full_name == 'ntygod/Zentwine' &&
      github.event.pull_request.head.ref == 'spike/ZT01-01-durable-workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      # No checkout, dependencies, scripts from the repository, or model calls.
      - name: Copy hash-verified lock to this branch only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh api repos/ntygod/Zentwine/actions/artifacts/10798535195/zip > zt01-lock.zip
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, zipfile
          with zipfile.ZipFile('zt01-lock.zip') as z:
              info = z.getinfo('package-lock.json')
              assert info.file_size == 85880
              raw = z.read(info)
          assert hashlib.sha256(raw).hexdigest() == 'f1f2eb4909b083e779f9be9dcb2587a60855cb89c25dfa0287d2941869233b2d'
          lock = json.loads(raw)
          assert lock['name'] == '@zentwine/spike-durable-workflow'
          assert lock['lockfileVersion'] == 3
          pathlib.Path('lock-payload.json').write_text(json.dumps({
              'message': 'build(ZT01-01): commit exact dependency lock from passing CI',
              'branch': 'spike/ZT01-01-durable-workflow',
              'content': base64.b64encode(raw).decode('ascii'),
          }))
          PY
          ACTUAL_HEAD="$(gh api repos/ntygod/Zentwine/git/ref/heads/spike/ZT01-01-durable-workflow --jq '.object.sha')"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          # No sha is supplied: an existing file cannot be overwritten by this import.
          gh api --method PUT repos/ntygod/Zentwine/contents/spikes/ZT01-01-durable-workflow/package-lock.json --input lock-payload.json --jq '{commit: .commit.sha, blob: .content.sha}'
