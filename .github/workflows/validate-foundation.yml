name: Validate engineering foundation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.10.0 --ignore-scripts
      - name: Install frozen dependencies
        run: |
          mkdir -p reports
          pnpm install --frozen-lockfile
          node --version > reports/node-version.txt
          pnpm --version > reports/pnpm-version.txt
          sha256sum pnpm-lock.yaml > reports/lock-sha256.txt
      - name: Verify checked-in formatting without rewriting files
        run: pnpm format:check
      - name: Check, build and test
        run: pnpm check 2>&1 | tee reports/check.log
      - name: Check documentation after dependency installation
        run: pnpm docs:check 2>&1 | tee reports/docs-check.log
      - name: Check environment diagnostics
        run: pnpm doctor 2>&1 | tee reports/doctor.log
      - name: Install browser and Chinese UI fonts
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install --yes fonts-noto-cjk
      - name: Test built workbench and standalone Studio
        run: pnpm test:e2e 2>&1 | tee reports/browser-tests.log
      - name: Verify development processes release every port
        run: |
          node --input-type=module - <<'JS' | tee reports/process-cleanup.log
          import net from 'node:net';
          const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function canListen(port) {
            return new Promise(resolve => {
              const server = net.createServer();
              server.once('error', () => resolve(false));
              server.listen(port, '127.0.0.1', () => server.close(() => resolve(true)));
            });
          }
          for (const port of [4100, 5173, 5174]) {
            const deadline = Date.now() + 5000;
            let released = await canListen(port);
            while (!released && Date.now() < deadline) {
              await delay(100);
              released = await canListen(port);
            }
            if (!released) throw new Error(`Development process leaked port ${port}`);
            console.log(`PASS: port ${port} released after browser tests`);
          }
          JS
      - name: Check dependency advisories and record license metadata
        run: |
          pnpm audit --audit-level high --json > reports/dependency-audit.json
          pnpm licenses list --json > reports/dependency-licenses.json
      - name: Verify build and tests did not modify tracked sources
        run: git diff --exit-code
      - name: Package exact source and evidence
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/tested-commit.txt
          git archive --format=zip HEAD -o reports/source.zip
          cp pnpm-lock.yaml reports/pnpm-lock.yaml
          if test -d apps/workbench/dist && test -d apps/studio/dist; then
            tar -czf reports/web-build.tar.gz apps/workbench/dist apps/studio/dist
          fi
          printf '%s\n' 'Exact checked-in source. Local engineering foundation only; no live models, business identity, persistent workspace, code editing or production release verified.' > reports/SCOPE.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zt01-02-foundation-evidence
          path: reports/
          retention-days: 14
          if-no-files-found: error
