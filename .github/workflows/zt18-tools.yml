name: ZT18 fixed tools
on:
  push:
    branches: [feat/ZT18-01-worktree-observation]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Package the exact existing formatter without lifecycle scripts
        shell: bash
        run: |
          mkdir -p /tmp/zt18-tools
          cd /tmp/zt18-tools
          npm pack prettier@3.6.2 --ignore-scripts --json > npm-pack.json
          node --version > node-version.txt
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > tested-commit.txt
          sha256sum prettier-3.6.2.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zt18-fixed-formatter
          path: /tmp/zt18-tools/
          if-no-files-found: error
          retention-days: 7
