name: Prepare ZT01-04 test lock object
on:
  push:
    branches: [feat/ZT01-04-isolated-testkit]
    paths: [.github/workflows/zt01-04-lock-object.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Construct only a verified Git blob; no checkout or ref update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,os
          root='https://api.github.com/repos/ntygod/Zentwine'
          def request(path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(root+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          original=base64.b64decode(request('/contents/pnpm-lock.yaml?ref=966a6e823713546c23ba684dda0ebd9e017a8996')['content']).decode()
          assert hashlib.sha256(original.encode()).hexdigest()=='d19afc5da12074ee3ad4af0fb3ac3fa6837bb7b85c79e22af5765165111abcca'
          packages="  pg-cloudflare@1.4.0:\n    resolution:\n      integrity: sha512-Vo7z/6rrQYxpNRylp4Tlob2elzbh+N/MOQbxFVWCxS7oEx6jF53GTJFxK2WWpKuBRkmiin4Mt+xofFDjx09R0A==\n  pg-connection-string@2.14.0:\n    resolution:\n      integrity: sha512-XwWDGcLRGCXAR8F/AM5bG7Q+A3Wm2s6QeEjlOKZLlH3UYcguiqCWKyWXVag5TLTIjR7oOJUY8kcADaZgWPyLeg==\n  pg-int8@1.0.1:\n    resolution:\n      integrity: sha512-WCtabS6t3c8SkpDBUlb1kjOs7l66xsGdKpIPZsg4wR+B3+u9UAum2odSsF9tnvxg80h4ZxLWMy4pRjOsFIqQpw==\n    engines:\n      node: '>=4.0.0'\n  pg-pool@3.14.0:\n    resolution:\n      integrity: sha512-gKtPkFdQPU3DksooVLi9LsjZxrsBUZIpa+7aVx+LV5pNh0KzP4Zleud2po+ConrxbuXGBJ6Hfer6hdgpIBpBaw==\n    peerDependencies:\n      pg: '>=8.0'\n  pg-protocol@1.16.0:\n    resolution:\n      integrity: sha512-sILXutLVjCLjcDuOmvhX5e2Z4cS5qG/6Bu3VkpFwdf/633ElGLpEh9bgmuI5I4sqKqkifQiGyiCcx1HdtrK7tg==\n  pg-types@2.2.0:\n    resolution:\n      integrity: sha512-qTAAlrEsl8s4OiEQY69wDvcMIdQN6wdz5ojQiOy6YRMuynxenON0O5oCpJI6lshc6scgAY8qvJ2On/p+CXY0GA==\n    engines:\n      node: '>=4'\n  pg@8.16.3:\n    resolution:\n      integrity: sha512-enxc1h0jA/aq5oSDMvqyW3q89ra6XIIDZgCX9vkMrnz5DFTw/Ny3Li2lFQ+pt3L6MCgm/5o2o8HW9hiJji+xvw==\n    engines:\n      node: '>= 16.0.0'\n    peerDependencies:\n      pg-native: '>=3.0.1'\n    peerDependenciesMeta:\n      pg-native:\n        optional: true\n  pgpass@1.0.5:\n    resolution:\n      integrity: sha512-FdW9r/jQZhSeohs1Z3sI1yxFQNFvMcnmfuj4WBMUTxOrAyLMaTcE1aAMBiTlbMNaXvBCQuVi0R7hd8udDSP7ug==\n  postgres-array@2.0.0:\n    resolution:\n      integrity: sha512-VpZrUqU5A69eQyW2c5CA1jtLecCsN2U/bD6VilrFDWq5+5UIEVO7nazS3TEcHf1zuPYO/sqGvUvW62g86RXZuA==\n    engines:\n      node: '>=4'\n  postgres-bytea@1.0.1:\n    resolution:\n      integrity: sha512-5+5HqXnsZPE65IJZSMkZtURARZelel2oXUEO8rH83VS/hxH5vv1uHquPg5wZs8yMAfdv971IU+kcPUczi7NVBQ==\n    engines:\n      node: '>=0.10.0'\n  postgres-date@1.0.7:\n    resolution:\n      integrity: sha512-suDmjLVQg78nMK2UZ454hAG+OAW+HQPZ6n++TNDUX+L0+uUlLywnoxJKDou51Zm+zTCjrCl0Nq6J9C5hP9vK/Q==\n    engines:\n      node: '>=0.10.0'\n  postgres-interval@1.2.0:\n    resolution:\n      integrity: sha512-9ZhXKM/rw350N1ovuWHbGxnGh/SNJ4cnxHiM0rxE4VN41wsg8P8zWn9hv/buK00RP4WvlOyr/RBDiptyxVbkZQ==\n    engines:\n      node: '>=0.10.0'\n  xtend@4.0.2:\n    resolution:\n      integrity: sha512-LKYU1iAXJXUgAXn9URjiu+MWhyUXHsvfp7mcuYm9dSUKK0/CjtrUwFAxD82/mCWbtLsGjFIad0wIsod4zrTAEQ==\n    engines:\n      node: '>=0.4'\n"
          snapshots="  pg-cloudflare@1.4.0:\n    optional: true\n  pg-connection-string@2.14.0: {}\n  pg-int8@1.0.1: {}\n  pg-pool@3.14.0(pg@8.16.3):\n    dependencies:\n      pg: 8.16.3\n  pg-protocol@1.16.0: {}\n  pg-types@2.2.0:\n    dependencies:\n      pg-int8: 1.0.1\n      postgres-array: 2.0.0\n      postgres-bytea: 1.0.1\n      postgres-date: 1.0.7\n      postgres-interval: 1.2.0\n  pg@8.16.3:\n    dependencies:\n      pg-connection-string: 2.14.0\n      pg-pool: 3.14.0(pg@8.16.3)\n      pg-protocol: 1.16.0\n      pg-types: 2.2.0\n      pgpass: 1.0.5\n    optionalDependencies:\n      pg-cloudflare: 1.4.0\n  pgpass@1.0.5:\n    dependencies:\n      split2: 4.2.0\n  postgres-array@2.0.0: {}\n  postgres-bytea@1.0.1: {}\n  postgres-date@1.0.7: {}\n  postgres-interval@1.2.0:\n    dependencies:\n      xtend: 4.0.2\n  xtend@4.0.2: {}\n"
          updated=original.replace('      prettier:\n','      pg:\n        specifier: 8.16.3\n        version: 8.16.3\n      prettier:\n',1).replace('packages:\n','packages:\n\n'+packages,1).replace('snapshots:\n','snapshots:\n\n'+snapshots,1)
          assert hashlib.sha256(updated.encode()).hexdigest()=='9efa8778cc3084badcc908e73852a37975446deb492bb1ce331c50d74a4e6995'
          blob=request('/git/blobs',{'content':updated,'encoding':'utf-8'})
          assert blob['sha']=='f00b4c9dcefc2ba11db87713ea67309dbae6249f'
          print('Verified lock blob:',blob['sha'])
          PY
