name: Prepare ZT01-03 workspace lock blob
on:
  push:
    branches: ['feat/ZT01-03-safe-foundations']
    paths: ['.github/workflows/zt01-03-lock-blob.yml']
permissions:
  contents: write
jobs:
  data-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify fixed input and output; create blob only, no ref updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          base = 'https://api.github.com/repos/ntygod/Zentwine'
          def call(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base+path, data=data, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as res: return json.load(res)
          def oid(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          original = call('/git/blobs/9a17902319c9f3509bbbfdb1b1c1504d4b9c02a7')
          raw = base64.b64decode(original['content'])
          assert oid(raw) == '9a17902319c9f3509bbbfdb1b1c1504d4b9c02a7'
          before = b'  packages/telemetry:\n    dependencies:\n      \'@zentwine/contracts\':\n        specifier: workspace:*\n        version: link:../contracts\n'
          after = before + b'      \'@zentwine/domain\':\n        specifier: workspace:*\n        version: link:../domain\n'
          assert raw.count(before) == 1
          updated = raw.replace(before, after)
          assert oid(updated) == 'a32ef30f7553d242cf4854cdbcf6aa1150488dc5'
          blob = call('/git/blobs', {'encoding':'base64','content':base64.b64encode(updated).decode()})
          assert blob['sha'] == oid(updated)
          print('Verified lock blob:', blob['sha'])
          PY
