name: Validate development plans

on:
  workflow_call:
permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install documentation-only schema validator
        run: |
          python3 -m venv /tmp/zentwine-docs-venv
          /tmp/zentwine-docs-venv/bin/python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate and export planning tasks
        run: |
          mkdir -p /tmp/zentwine-plan-artifacts
          set -o pipefail
          /tmp/zentwine-docs-venv/bin/python scripts/validate_plans.py --validate-schemas --export /tmp/zentwine-plan-artifacts/backlog.json | tee /tmp/zentwine-plan-artifacts/validation.txt
      - name: Package reviewed documentation
        run: |
          git archive --format=zip --output=/tmp/zentwine-plan-artifacts/Zentwine-development-plans.zip HEAD
          git rev-parse HEAD > /tmp/zentwine-plan-artifacts/commit.txt
          printf '%s\n' 'Documentation/schema checks only. Product and real-model tests are not run.' > /tmp/zentwine-plan-artifacts/SCOPE.txt
      - name: Hash and verify the documentation artifact
        run: |
          python3 scripts/quality/gate.py manifest --directory /tmp/zentwine-plan-artifacts --suite documentation --job-status success --output /tmp/zentwine-plan-artifacts/artifact-manifest.json
          python3 scripts/quality/gate.py verify-manifest --directory /tmp/zentwine-plan-artifacts --expected-commit "$(git rev-parse HEAD)"
      - name: Upload planning package and check results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zentwine-development-plans
          path: /tmp/zentwine-plan-artifacts/
          if-no-files-found: error
          retention-days: 14
